name: GitHub Pages Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          set -e
          test -f index.html
          test -f js/supabase-config.js
          test -f js/frontend/amour-ai.js
          test -d js
          grep -q "bawryduhgopvxynqmiyo.supabase.co" js/supabase-config.js
          echo "✅ index.html présent"
          echo "✅ Supabase configuré"
          echo "✅ Amour AI présente"
          echo "✅ Frontend L'univers d'amour valide"
