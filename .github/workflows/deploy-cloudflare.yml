name: Deploy luniversdamour to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rebuild and verify site
        run: npm run build

      - name: Verify Cloudflare token and Worker access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          token_file="$(mktemp)"
          account_file="$(mktemp)"
          trap 'rm -f "$token_file" "$account_file"' EXIT

          curl -sS --fail-with-body             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/user/tokens/verify"             > "$token_file"

          token_success="$(jq -r '.success' "$token_file")"
          token_status="$(jq -r '.result.status // "unknown"' "$token_file")"
          echo "Cloudflare token: success=$token_success status=$token_status"

          if [ "$token_success" != "true" ] || [ "$token_status" != "active" ]; then
            jq '{success, errors}' "$token_file"
            exit 1
          fi

          account_http="$(curl -sS -o "$account_file" -w "%{http_code}"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"

          echo "Cloudflare Workers Scripts API: HTTP $account_http"

          if [ "$account_http" -ge 400 ]; then
            jq '{success, errors, messages}' "$account_file"
            exit 1
          fi

          jq '{success, worker_count: (.result | length)}' "$account_file"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
