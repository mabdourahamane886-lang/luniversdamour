<style>
:root{--bg:#fff;--text:#202123;--muted:#777;--soft:#f7f7f8;--line:#e5e5e5}

.app,.main,.content,.card{width:100%;height:100%;min-height:100%}

<body>
<div class="app">
<main class="main">
<header class="topbar">
  <div class="ai-top"><a class="home-brand" href="/" aria-label="Retour à L’univers d’amour"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 17c0-5 3-9 8-9s8 4 8 9"/><path d="M8 17c0 5 3 9 8 9s8-4 8-9"/><path d="M5 13c0 3 2 5 5 5M27 13c0 3-2 5-5 5"/></svg></span><span><strong>L’univers d’amour</strong><small>Assistant relationnel</small></span></a></div>
  <div class="ai-top">
    <button class="menu" id="menu" type="button" aria-label="Ouvrir l’historique des conversations" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 8h14M5 16h14"/></svg>
    </button>
  </div>
</header>

<aside class="sidebar" id="sidebar" aria-label="Historique des conversations">
  <div class="sidebar-head"><div><strong>Amour AI</strong><span>Vos conversations</span></div><button id="closeSidebar" type="button" aria-label="Fermer l’historique">×</button></div>
  <button class="new-chat" id="newChat" type="button"><span aria-hidden="true">＋</span> Nouvelle conversation</button>
  <label class="search-label" for="search">Rechercher dans l’historique</label>
  <input id="search" class="history-search" type="search" placeholder="Rechercher…" autocomplete="off">
  <div id="history" class="history" aria-live="polite"></div>
  <a class="back-home" href="/">← Retour à L’univers d’amour</a>
</aside>
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fermer le menu"></button>

<div class="content">
<section class="card">
  <div class="chat-head"><h1>Amour AI</h1></div>
  <div class="messages" id="messages"></div>
  <div class="thinking" id="thinking" hidden>Amour AI réfléchit…</div>
  <div class="error" id="error" hidden></div>

  <div class="image-panel" id="imagePanel">
    <textarea id="imagePrompt" placeholder="Décris l’image que tu veux créer…"></textarea>
    <div style="display:flex;gap:7px;margin-top:7px">
      <button id="generateImage">Générer l’image</button>
      <button id="closeImage">Fermer</button>
    </div>
    <div id="imageResult"></div>
  </div>

  <form class="composer" id="form">
    <div class="voice-slot"></div>
    <button class="mic" type="button" id="mic" aria-label="Microphone"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
    <div class="composer-wrap"><textarea id="input" maxlength="3000" placeholder="Demander à Amour AI" aria-label="Message à Amour AI"></textarea></div>
    <button class="plus" type="button" id="imageToggleQuick" aria-label="Créer une image">+</button>
    <button class="send" id="send" type="submit" aria-label="Envoyer"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </form>
  <div class="mobile-note">Amour AI peut faire des erreurs. Vérifiez les informations importantes.</div>
</section>
</div>
</main>
</div>
<script src="js/frontend/amour-ai-dashboard.js"></script>
<script>
(()=>{const p=document.getElementById('imagePanel'),q=document.getElementById('imageToggleQuick'),g=document.getElementById('generateImage'),c=document.getElementById('closeImage'),i=document.getElementById('imagePrompt'),r=document.getElementById('imageResult');
const open=()=>p.classList.toggle('open');q.onclick=open;c.onclick=()=>p.classList.remove('open');
document.addEventListener('click',e=>{if(e.target.closest('[data-image-suggestion]'))p.classList.add('open')});
g.onclick=async()=>{const prompt=i.value.trim();if(!prompt)return;i.disabled=true;g.disabled=true;g.textContent='Création…';r.textContent='Amour AI crée votre image…';try{const x=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const d=await x.json().catch(()=>({}));if(!x.ok)throw new Error(d?.error||d?.message||('HTTP '+x.status));const url=d?.url||d?.image||d?.data?.url;if(!url)throw new Error('Image introuvable dans la réponse.');r.innerHTML='<img class="generated" src="'+String(url).replace(/"/g,'&quot;')+'" alt="Image générée par Amour AI">'}catch(e){r.textContent='Impossible de générer l’image pour le moment : '+(e.message||'erreur inconnue')}finally{i.disabled=false;g.disabled=false;g.textContent='Générer l’image'}};
const mic=document.getElementById('mic'),input=document.getElementById('input'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){mic.disabled=true;mic.title='La dictée vocale n’est pas disponible sur ce navigateur.'}else{const rec=new SR();rec.lang='fr-FR';rec.interimResults=false;rec.continuous=false;rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||'';if(t){input.value=(input.value?input.value+' ':'')+t;input.dispatchEvent(new Event('input',{bubbles:true));input.focus()}};mic.onclick=()=>{try{rec.start()}catch(e){}}}
})();
</script>

<script>
(()=>{const sidebar=document.getElementById('sidebar'),backdrop=document.getElementById('sidebarBackdrop'),menu=document.getElementById('menu'),close=document.getElementById('closeSidebar'),newChat=document.getElementById('newChat'),history=document.getElementById('history');
if(!sidebar||!backdrop||!menu)return;
const sync=()=>menu.setAttribute('aria-expanded',String(sidebar.classList.contains('open')));
const shut=()=>{sidebar.classList.remove('open');sync()};
backdrop.addEventListener('click',shut);close?.addEventListener('click',shut);
menu.addEventListener('click',()=>setTimeout(sync,0));
newChat?.addEventListener('click',shut);history?.addEventListener('click',()=>setTimeout(sync,0));
document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
})();
</script>

</body></html>
