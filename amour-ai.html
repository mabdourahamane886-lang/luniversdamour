<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amour AI — L’univers d’amour</title><meta name="description" content="Amour AI, assistant conversationnel et créatif de L’univers d’amour."><style>
:root{--bg:#0d0710;--panel:#171019;--panel2:#21141f;--line:#3b2736;--text:#fff7fa;--muted:#b99eaa;--pink:#ef476f;--pink2:#ff8daa}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 75% 0,#ef476f33,transparent 28%),var(--bg)}button,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.sidebar{border-right:1px solid var(--line);background:#110a12;padding:18px;display:flex;flex-direction:column;gap:12px}.brand{font-weight:800;padding-bottom:12px}.new,.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);color:#fff}.new{background:linear-gradient(135deg,#ef476f33,#ff8daa11);font-weight:700;text-align:left}.history{overflow:auto;flex:1}.group-title{color:#806d77;font-size:9px;padding:13px 6px 6px;text-transform:uppercase}.conv{display:flex}.conv button{flex:1;background:transparent;color:#cdbbc3;border:0;text-align:left;padding:9px;border-radius:8px;font-size:10px}.conv .active,.conv button:hover{background:#261721;color:#fff}.del{flex:0 0 30px!important}.main{padding:16px;min-width:0}.topbar{max-width:1180px;margin:auto;height:55px;display:flex;align-items:center;justify-content:space-between}.home{color:#d8c8cf;border:1px solid var(--line);background:var(--panel);padding:9px 11px;border-radius:9px;text-decoration:none;font-size:10px}.card{max-width:1180px;margin:auto;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,#21141f,#120b13);overflow:hidden}.chat-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.chat-head h1{margin:0;font-size:24px}.chat-head p{margin:5px 0 0;color:var(--muted);font-size:10px}.badge{padding:7px 9px;border:1px solid #5d3b48;border-radius:99px;color:#ffc0cf;font-size:9px}.messages{height:calc(100vh - 270px);min-height:390px;overflow:auto;padding:24px}.empty{text-align:center;max-width:580px;margin:8vh auto}.empty h2{font-size:29px}.empty p{color:var(--muted);font-size:12px;line-height:1.7}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--panel);color:#cdbbc3;border-radius:99px;padding:9px 12px;font-size:9px}.msg{display:flex;gap:10px;max-width:850px;margin:0 auto 18px}.msg.user{justify-content:flex-end}.avatar{width:31px;height:31px;flex:0 0 31px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--pink),#92233f)}.bubble{max-width:85%;border:1px solid var(--line);background:var(--panel2);border-radius:15px;padding:12px 14px}.user .bubble{background:#33232d}.text{white-space:pre-wrap;font-size:12px;line-height:1.75}.actions{display:flex;gap:5px;margin-top:8px}.actions button{border:1px solid #4a2d3a;background:#261721;color:#bda8b1;border-radius:7px;padding:5px 7px;font-size:8px}.composer{border-top:1px solid var(--line);padding:12px;background:#0d0710;display:flex;gap:9px;align-items:flex-end}.composer-wrap{flex:1;border:1px solid #4a3040;border-radius:15px;background:#130c14;padding:10px}.composer textarea{width:100%;min-height:60px;max-height:160px;border:0;outline:0;resize:none;background:transparent;color:#fff;font-size:12px}.meta{display:flex;justify-content:space-between;color:#6f5d65;font-size:8px;margin-top:4px}.send{width:50px;height:50px;border:0;border-radius:14px;color:#fff;background:linear-gradient(145deg,var(--pink),#b52d50)}.thinking,.error{padding:9px 20px;font-size:9px}.error{background:#31131e;color:#ff9db2}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}.tool{border:1px solid var(--line);background:#171019;color:#cdbbc3;border-radius:9px;padding:8px 10px;font-size:9px}.image-panel{display:none;padding:12px 14px;border-top:1px solid var(--line)}.image-panel.open{display:block}.image-panel textarea{width:100%;min-height:70px;background:#130c14;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}.image-actions{display:flex;gap:7px;margin-top:7px}.generated{max-width:100%;border-radius:14px;margin-top:10px}.mobile-menu{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:285px;transform:translateX(-105%);transition:.25s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:block}.main{padding:8px}.messages{height:calc(100vh - 315px);padding:14px}.chat-head{padding:14px}.chat-head h1{font-size:20px}.empty{margin:5vh auto}.composer textarea{min-height:65px}.home{display:none}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand">♥ Amour AI<br><small style="color:#b99eaa">L’univers d’amour</small></div><button class="new" id="newChat">＋ Nouvelle conversation</button><input class="search" id="search" placeholder="Rechercher…"><div class="history" id="history"></div></aside><main class="main"><div class="topbar"><button class="tool mobile-menu" id="menu">☰</button><b>Amour AI · assistant intelligent</b><a class="home" href="index.html">Accueil</a></div><section class="card"><div class="chat-head"><div><h1>Votre espace de conversation</h1><p>Amour, relations, vie, études, entrepreneuriat, technologie et créativité.</p></div><span class="badge">● IA en ligne</span></div><div class="messages" id="messages"></div><div class="thinking" id="thinking" hidden>Amour AI réfléchit…</div><div class="error" id="error" hidden></div><div class="tools"><button class="tool" id="imageToggle">✦ Créer une image</button><button class="tool" data-prompt="Donne-moi un conseil pour mieux communiquer dans une relation.">♥ Relations</button><button class="tool" data-prompt="Aide-moi à développer une idée de projet.">◆ Projet</button><button class="tool" data-prompt="Explique-moi ce sujet simplement.">◇ Apprentissage</button></div><div class="image-panel" id="imagePanel"><textarea id="imagePrompt" placeholder="Décris l’image que tu veux créer… Exemple : un couple africain heureux au coucher du soleil, style photo premium."></textarea><div class="image-actions"><button class="tool" id="generateImage">Générer l’image</button><button class="tool" id="closeImage">Fermer</button></div><div id="imageResult"></div></div><form class="composer" id="form"><div class="composer-wrap"><textarea id="input" maxlength="3000" placeholder="Écrivez votre message à Amour AI…"></textarea><div class="meta"><span>Entrée pour envoyer · Maj + Entrée pour aller à la ligne</span><span id="count">0/3000</span></div></div><button class="send" id="send">➤</button></form></section></main></div><script src="js/frontend/amour-ai-dashboard.js"></script><script>
(()=>{const p=document.getElementById('imagePanel'),t=document.getElementById('imageToggle'),g=document.getElementById('generateImage'),c=document.getElementById('closeImage'),i=document.getElementById('imagePrompt'),r=document.getElementById('imageResult');t.onclick=()=>p.classList.toggle('open');c.onclick=()=>p.classList.remove('open');g.onclick=async()=>{const prompt=i.value.trim();if(!prompt)return;i.disabled=true;g.disabled=true;g.textContent='Création…';r.textContent='Amour AI crée votre image…';try{const x=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const d=await x.json();if(!x.ok)throw new Error(d?.error?.message||d?.message||'Erreur de génération');const src=d?.data?.url||(d?.data?.b64_json?`data:image/png;base64,${d.data.b64_json}`:'');if(!src)throw new Error('Image non reçue');r.innerHTML=`<img class="generated" src="${src}" alt="Image créée par Amour AI">`}catch(e){r.textContent=e.message}finally{i.disabled=false;g.disabled=false;g.textContent='Générer l’image'}};document.addEventListener('click',e=>{const b=e.target.closest('[data-prompt]');if(b){const input=document.getElementById('input');input.value=b.dataset.prompt;input.dispatchEvent(new Event('input'));input.focus()}})})();
</script></body></html>
