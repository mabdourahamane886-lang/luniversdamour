<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Amour AI — L’univers d’amour</title><meta name="description" content="Amour AI, votre assistant intelligent pour les relations, les émotions, la créativité et la vie quotidienne."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
:root{--bg:#fff;--text:#202123;--muted:#6e6e80;--line:#e5e5e5;--soft:#f7f7f8;--accent:#111;--heart:#e45a74}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex;background:#fff}
.sidebar{display:none}
.main{width:100%;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#fff;border:0;position:relative;z-index:10}
.top-left{display:flex;align-items:center;gap:10px}
.menu{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:#f7f7f8;color:#202123;font-size:20px}
.plan,.home{display:none}
.ai-top{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#303030}
.ai-top span:first-child{display:none}
.ai-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#f7f7f8;color:#202123;box-shadow:none;font-size:19px}
.content{width:100%;margin:0;padding:0;display:flex;flex:1;min-height:0}
.card{width:100%;min-height:calc(100vh - 72px);display:flex;flex-direction:column;overflow:hidden;border:0;border-radius:0;box-shadow:none;background:#fff}
.chat-head{position:absolute;left:50%;top:20px;transform:translateX(-50%);border:0;padding:0;z-index:12;pointer-events:none}
.chat-head h1{margin:0;font-size:18px;line-height:1.2;font-weight:600;color:#202123;font-family:Arial,Helvetica,sans-serif;white-space:nowrap}
.chat-head p,.badge{display:none}
.messages{flex:1;overflow:auto;padding:24px 18px 160px;scroll-behavior:smooth}
.empty{max-width:760px;margin:26vh auto 0;text-align:center}
.empty .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#f7f7f8;color:#202123;box-shadow:none;font-size:24px}
.empty h2{margin:0;font:600 32px/1.15 Arial,Helvetica,sans-serif;color:#202123}
.empty p{color:#6e6e80;font-size:15px;line-height:1.6;max-width:560px;margin:12px auto 22px}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;color:#444;font-size:13px}
.msg{display:flex;align-items:flex-start;gap:10px;max-width:820px;margin:0 auto 22px}
.msg.user{justify-content:flex-end}
.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:#f1f1f1;color:#444;font-size:12px}
.user .avatar{order:2;background:#202123;color:#fff}
.bubble{max-width:min(78%,680px);padding:11px 14px;border:1px solid var(--line);background:#f7f7f8;border-radius:18px 18px 18px 5px}
.user .bubble{background:#f4f4f4;border-color:#f4f4f4;border-radius:18px 18px 5px 18px}
.text{white-space:pre-wrap;font-size:15px;line-height:1.65}
.actions{display:flex;gap:5px;margin-top:8px}
.actions button{padding:5px 8px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#666;font-size:11px}
.thinking,.error{padding:8px 18px;font-size:13px}
.thinking{color:#777;background:#fff;text-align:center}
.error{background:#fff1f1;color:#a33}
.quick,.tools{display:none}
.image-panel{display:none;position:absolute;left:16px;right:16px;bottom:88px;padding:12px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 35px rgba(0,0,0,.12);z-index:20}
.image-panel.open{display:block}
.image-panel textarea{width:100%;min-height:75px;border:0;outline:0;border-radius:12px;padding:10px;background:var(--soft);resize:vertical;font-size:14px}
.generated{display:block;max-width:100%;border-radius:14px;margin-top:10px}
.composer{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(760px,calc(100% - 32px));display:flex;align-items:flex-end;gap:8px;padding:10px 12px;background:#f7f7f8;border:1px solid #e5e5e5;border-radius:28px;box-shadow:0 2px 12px rgba(0,0,0,.05);z-index:15}
.plus{width:36px;height:36px;flex:0 0 36px;border:0;border-radius:50%;background:transparent;color:#666;font-size:22px}
.composer-wrap{flex:1;min-width:0;border:0;padding:0;background:transparent;box-shadow:none}
.composer textarea{display:block;width:100%;min-height:28px;max-height:130px;border:0;outline:0;resize:none;background:transparent;color:var(--text);font-size:15px;line-height:1.5;padding:5px 0}
.composer textarea::placeholder{color:#777}
.meta{display:none}
.composer-right{display:flex;align-items:center;gap:4px}
.model{display:none}
.mic{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#555}
.mic.recording{color:#fff;background:#d94d61}
.send{width:36px;height:36px;border:0;border-radius:50%;color:#fff;background:#202123;box-shadow:none}
.send:disabled{opacity:.45}
.mobile-note{position:absolute;bottom:2px;left:0;right:0;text-align:center;color:#9a9a9a;font-size:10px;padding:0;z-index:14}
#imageToggle,#imageToggleQuick,#generateImage,#closeImage{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 11px;color:#444;font-size:12px}
#imageToggleQuick i{pointer-events:none}
@media(min-width:821px){
  .menu{display:grid}
  .empty{margin-top:18vh}
  .composer{bottom:24px}
  .mobile-note{bottom:6px}
}
@media(max-width:520px){
  .topbar{height:68px;padding:0 14px}
  .menu,.ai-dot{width:42px;height:42px}
  .chat-head{top:21px}
  .chat-head h1{font-size:17px}
  .messages{padding:12px 10px 145px}
  .empty{margin-top:25vh}
  .empty .big{width:58px;height:58px}
  .empty h2{font-size:28px}
  .empty p{font-size:14px;padding:0 12px}
  .chips{padding:0 8px}
  .chip{font-size:12px;padding:9px 12px}
  .composer{bottom:22px;width:calc(100% - 24px);padding:8px 10px}
  .composer textarea{font-size:15px}
  .mobile-note{bottom:5px;font-size:9px}
}
</style></head><body>
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="menu" id="menu" aria-label="Ouvrir le menu"><i class="fa-solid fa-bars"></i></button>
      </div>
      <div class="ai-top">
        <span>Amour AI</span>
        <span class="ai-dot"><i class="fa-regular fa-heart"></i></span>
      </div>
    </header>
    <div class="content">
      <section class="card">
        <div class="chat-head">
          <h1>Amour AI</h1>
          <p></p><span class="badge"></span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="thinking" id="thinking" hidden><i class="fa-solid fa-spinner"></i> Amour AI réfléchit…</div>
        <div class="error" id="error" hidden></div>
        <div class="image-panel" id="imagePanel">
          <textarea id="imagePrompt" placeholder="Décris l’image que tu veux créer…"></textarea>
          <div style="display:flex;gap:7px;margin-top:7px">
            <button id="generateImage">Générer l’image</button>
            <button id="closeImage">Fermer</button>
          </div>
          <div id="imageResult"></div>
        </div>
        <form class="composer" id="form">
          <button class="plus" type="button" id="imageToggleQuick" aria-label="Créer une image"><i class="fa-solid fa-plus"></i></button>
          <div class="composer-wrap">
            <textarea id="input" maxlength="3000" placeholder="Demander à Amour AI" aria-label="Message à Amour AI"></textarea>
          </div>
          <div class="composer-right">
            <button class="mic" type="button" id="mic" aria-label="Microphone" title="Dicter"><i class="fa-solid fa-microphone"></i></button>
            <button class="send" id="send" type="submit" aria-label="Envoyer"><i class="fa-solid fa-arrow-up"></i></button>
          </div>
        </form>
        <div class="mobile-note">Amour AI peut faire des erreurs. Vérifiez les informations importantes.</div>
      </section>
    </div>
  </main>
</div>
<script src="js/frontend/amour-ai-dashboard.js"></script>
<script>
(()=>{const p=document.getElementById('imagePanel'),q=document.getElementById('imageToggleQuick'),g=document.getElementById('generateImage'),c=document.getElementById('closeImage'),i=document.getElementById('imagePrompt'),r=document.getElementById('imageResult');
const open=()=>p.classList.toggle('open');q.onclick=open;c.onclick=()=>p.classList.remove('open');
g.onclick=async()=>{const prompt=i.value.trim();if(!prompt)return;i.disabled=true;g.disabled=true;g.textContent='Création…';r.textContent='Amour AI crée votre image…';try{const x=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const d=await x.json().catch(()=>({}));if(!x.ok)throw new Error(d?.error||d?.message||('HTTP '+x.status));const url=d?.url||d?.image||d?.data?.url;if(!url)throw new Error('Image introuvable dans la réponse.');r.innerHTML='<img class="generated" src="'+String(url).replace(/"/g,'&quot;')+'" alt="Image générée par Amour AI">'}catch(e){r.textContent='Impossible de générer l’image pour le moment : '+(e.message||'erreur inconnue')}finally{i.disabled=false;g.disabled=false;g.textContent='Générer l’image'}};
const mic=document.getElementById('mic'),input=document.getElementById('input'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){mic.disabled=true;mic.title='La dictée vocale n’est pas disponible sur ce navigateur.'}else{const rec=new SR();rec.lang='fr-FR';rec.interimResults=false;rec.continuous=false;rec.onstart=()=>mic.classList.add('recording');rec.onend=()=>mic.classList.remove('recording');rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||'';if(t){input.value=(input.value?input.value+' ':'')+t;input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()}};mic.onclick=()=>{try{rec.start()}catch(e){}}}
})();
</script>
</body></html>
