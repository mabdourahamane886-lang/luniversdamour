<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amour AI — L’univers d’amour</title>
<meta name="description" content="Amour AI, votre assistant intelligent pour l’amour, les relations, la créativité et la vie quotidienne.">
<style>
:root{--bg:#fff;--text:#202123;--muted:#777;--soft:#f7f7f8;--line:#e5e5e5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app,.main,.content,.card{width:100%;height:100%;min-height:100%}
.main{position:relative;background:#fff}
.topbar{position:fixed;inset:0 0 auto 0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:20;pointer-events:none}
.topbar button{pointer-events:auto}
.menu{width:44px;height:44px;border:0;border-radius:50%;background:#f7f7f8;display:grid;place-items:center;color:#202123}
.menu svg{width:25px;height:25px}
.ai-top{display:flex;align-items:center}
.ai-dot{width:44px;height:44px;border-radius:50%;background:#f7f7f8;display:grid;place-items:center}
.ai-dot svg{width:25px;height:25px}
.chat-head{display:none}
.messages{position:absolute;inset:0;overflow:auto;padding:90px 18px 190px;scroll-behavior:smooth}
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-57%);width:min(620px,calc(100% - 40px));text-align:center}
.empty .big{display:none}
.empty h2{display:none}
.empty p{display:none}
.empty .chips{display:flex;flex-direction:column;align-items:flex-end;gap:28px;margin-left:auto;width:max-content}
.empty .chip{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#666;font-size:17px;padding:0;text-align:right}
.empty .chip .chip-icon{width:32px;height:32px;display:grid;place-items:center;color:#666}
.empty .chip svg{width:28px;height:28px}
.msg{display:flex;align-items:flex-start;gap:10px;max-width:820px;margin:0 auto 22px}
.msg.user{justify-content:flex-end}
.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:#f1f1f1;color:#444}
.user .avatar{order:2;background:#202123;color:#fff}
.bubble{max-width:min(78%,680px);padding:11px 14px;border:1px solid var(--line);background:#f7f7f8;border-radius:18px 18px 18px 5px}
.user .bubble{background:#f4f4f4;border-color:#f4f4f4;border-radius:18px 18px 5px 18px}
.text{white-space:pre-wrap;font-size:15px;line-height:1.65}
.actions{display:flex;gap:5px;margin-top:8px}
.actions button{padding:5px 8px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#666;font-size:11px}
.thinking,.error{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;z-index:30;font-size:13px}
.thinking{color:#777;background:#fff}
.error{background:#fff1f1;color:#a33;padding:8px 14px;border-radius:10px}
.composer{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);width:min(650px,calc(100% - 38px));height:58px;display:flex;align-items:center;gap:10px;padding:7px 10px;background:#fff;border:1px solid #e3e3e3;border-radius:30px;box-shadow:0 5px 24px rgba(0,0,0,.08);z-index:40}
.composer-wrap{flex:1;min-width:0}
.composer textarea{display:block;width:100%;height:42px;max-height:42px;border:0;outline:0;resize:none;background:transparent;color:#202123;font-size:16px;line-height:42px;padding:0}
.composer textarea::placeholder{color:#929292}
.voice-slot{display:flex;align-items:center}
.plus,.mic,.send{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:50%;display:grid;place-items:center}
.plus{order:5;background:transparent;color:#111;font-size:30px;font-weight:300}
.mic{background:transparent;color:#111;font-size:21px}
.send{background:#202123;color:#fff}
.send:disabled{opacity:.45}
.amour-voice-button{width:42px;height:42px;border:0;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center}
.amour-voice-button svg{width:22px;height:22px}
.amour-voice-button.recording{background:#e51b72;animation:amourPulse 1.1s infinite}
@keyframes amourPulse{50%{box-shadow:0 0 0 7px rgba(229,27,114,.12)}}
.mobile-note{position:fixed;left:0;right:0;bottom:5px;text-align:center;color:#999;font-size:10px;z-index:39}
.image-panel{display:none;position:fixed;left:50%;bottom:98px;transform:translateX(-50%);width:min(650px,calc(100% - 38px));padding:12px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 35px rgba(0,0,0,.12);z-index:50}
.image-panel.open{display:block}
.image-panel textarea{width:100%;min-height:75px;border:0;outline:0;border-radius:12px;padding:10px;background:var(--soft);resize:vertical}
.generated{display:block;max-width:100%;border-radius:14px;margin-top:10px}
@media(max-width:520px){
 .topbar{height:70px;padding:0 18px}
 .menu,.ai-dot{width:44px;height:44px}
 .messages{padding-bottom:175px}
 .empty{top:47%;transform:translate(-50%,-50%);width:calc(100% - 34px)}
 .empty .chips{gap:30px}
 .empty .chip{font-size:16px}
 .composer{bottom:30px;width:calc(100% - 34px);height:58px}
 .composer textarea{font-size:16px}
 .mobile-note{bottom:6px;font-size:9px}
}
</style>
</head>
<body>
<div class="app">
<main class="main">
<header class="topbar">
  <div></div>
  <div class="ai-top">
    <button class="menu" id="menu" aria-label="Ouvrir le menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 8h14M5 16h14"/></svg>
    </button>
  </div>
</header>
<div class="content">
<section class="card">
  <div class="chat-head"><h1>Amour AI</h1></div>
  <div class="messages" id="messages"></div>
  <div class="thinking" id="thinking" hidden>Amour AI réfléchit…</div>
  <div class="error" id="error" hidden></div>

  <div class="image-panel" id="imagePanel">
    <textarea id="imagePrompt" placeholder="Décris l’image que tu veux créer…"></textarea>
    <div style="display:flex;gap:7px;margin-top:7px">
      <button id="generateImage">Générer l’image</button>
      <button id="closeImage">Fermer</button>
    </div>
    <div id="imageResult"></div>
  </div>

  <form class="composer" id="form">
    <div class="voice-slot"></div>
    <button class="mic" type="button" id="mic" aria-label="Microphone"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
    <div class="composer-wrap"><textarea id="input" maxlength="3000" placeholder="Demander à Amour AI" aria-label="Message à Amour AI"></textarea></div>
    <button class="plus" type="button" id="imageToggleQuick" aria-label="Créer une image">+</button>
    <button class="send" id="send" type="submit" aria-label="Envoyer"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </form>
  <div class="mobile-note">Amour AI peut faire des erreurs. Vérifiez les informations importantes.</div>
</section>
</div>
</main>
</div>
<script src="js/frontend/amour-ai-dashboard.js"></script>
<script>
(()=>{const p=document.getElementById('imagePanel'),q=document.getElementById('imageToggleQuick'),g=document.getElementById('generateImage'),c=document.getElementById('closeImage'),i=document.getElementById('imagePrompt'),r=document.getElementById('imageResult');
const open=()=>p.classList.toggle('open');q.onclick=open;c.onclick=()=>p.classList.remove('open');
document.addEventListener('click',e=>{if(e.target.closest('[data-image-suggestion]'))p.classList.add('open')});
g.onclick=async()=>{const prompt=i.value.trim();if(!prompt)return;i.disabled=true;g.disabled=true;g.textContent='Création…';r.textContent='Amour AI crée votre image…';try{const x=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const d=await x.json().catch(()=>({}));if(!x.ok)throw new Error(d?.error||d?.message||('HTTP '+x.status));const url=d?.url||d?.image||d?.data?.url;if(!url)throw new Error('Image introuvable dans la réponse.');r.innerHTML='<img class="generated" src="'+String(url).replace(/"/g,'&quot;')+'" alt="Image générée par Amour AI">'}catch(e){r.textContent='Impossible de générer l’image pour le moment : '+(e.message||'erreur inconnue')}finally{i.disabled=false;g.disabled=false;g.textContent='Générer l’image'}};
const mic=document.getElementById('mic'),input=document.getElementById('input'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){mic.disabled=true;mic.title='La dictée vocale n’est pas disponible sur ce navigateur.'}else{const rec=new SR();rec.lang='fr-FR';rec.interimResults=false;rec.continuous=false;rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||'';if(t){input.value=(input.value?input.value+' ':'')+t;input.dispatchEvent(new Event('input',{bubbles:true));input.focus()}};mic.onclick=()=>{try{rec.start()}catch(e){}}}
})();
</script>
</body></html>
